version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true
  skip-dirs:
    - frontend
    - build
    - internal/surge

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - bodyclose
    - bidichk
    - asciicheck
    - gocheckcompilerdirectives
    - nolintlint
    - misspell
    - copyloopvar
    - durationcheck
    - nosprintfhostport
    - errchkjson
    - canonicalheader
    - rowserrcheck
    - sqlclosecheck
    - nilerr
    - nilnesserr
    - unconvert
    - gocritic
  settings:
    copyloopvar:
      check-alias: true
  exclusions:
    paths:
      - internal/surge
    rules:
      - linters:
          - unused
        path: internal/wailsapp/(extractor_capability|extractor_setup_diagnostics|host_auth_diagnostics|app_auth_generic|host_auth_generic|app)\.go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      module-path: goaria-v3
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(goaria-v3)
        - default
  exclusions:
    paths:
      - internal/surge
      - third_party
