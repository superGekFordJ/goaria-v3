version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "goaria-v3"
  BIN_DIR: "bin"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  GOOS: '{{.GOOS | default OS}}'
  PNPM: '{{if eq OS "windows"}}cmd /c pnpm{{else}}pnpm{{end}}'
  EXTRACTOR_VARIANT:
    sh: 'printf "%s" "${EXTRACTOR_VARIANT:-}"'
  EXTRACTOR_BUILD_TAGS:
    sh: '. "{{.ROOT_DIR}}/scripts/extractor_tags.sh" "${EXTRACTOR_VARIANT:-}"'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          EXTRACTOR_VARIANT: '{{.EXTRACTOR_VARIANT}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          EXTRACTOR_VARIANT: '{{.EXTRACTOR_VARIANT}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  # Convenience: frontend dev only (no Go dev server)
  dev:frontend:
    summary: Runs only the frontend dev server (uses VITE_PORT)
    cmds:
      - task: common:dev:frontend
        vars:
          EXTRACTOR_VARIANT: '{{.EXTRACTOR_VARIANT}}'

  # Code quality
  lint:go:
    summary: Run golangci-lint fmt, then dual-tag run (default + extractor)
    cmds:
      - golangci-lint fmt ./...
      - golangci-lint run ./...
      - golangci-lint run --build-tags extractor ./...

  lint:frontend:
    summary: Run frontend lint (pnpm run lint)
    dir: frontend
    cmds:
      - '{{.PNPM}} run lint'

  test:go:
    summary: Run Go tests
    cmds:
      - go test ./...
      - go test -race ./...

  test:frontend:
    summary: Run frontend tests (Vitest)
    dir: frontend
    cmds:
      - '{{.PNPM}} test:run'

  test:all:
    summary: Run all tests (Go + Frontend)
    cmds:
      - task: test:go
      - task: test:frontend

  test:extractor:closure:
    summary: Verify full variant closure, wrapper enforcement, and back-to-back switch
    cmds:
      - node scripts/verify_variant_closure.mjs

  vendor:surge:
    summary: Vendor Surge download engine core files
    cmds:
      - go run ./scripts/vendor_surge.go

  # Extractor release pack supply-chain checks
  extractor:packs:verify:
    summary: Verify optional extractor release packs and generate embedded pack code when configured
    cmds:
      - go run ./scripts/extractorpacks verify --lock build/extractor/packs.lock.json --out internal/extractor/embedded_packs_release_gen.go --provenance-out build/extractor/verified_packs.provenance.json

  extractor:packs:verify:required:
    summary: Verify required extractor release packs for release packaging
    cmds:
      - go run ./scripts/extractorpacks verify --lock build/extractor/packs.lock.json --out internal/extractor/embedded_packs_release_gen.go --provenance-out build/extractor/verified_packs.provenance.json --required

  extractor:packs:fixture:
    summary: Verify the public extractor pack supply-chain fixture
    cmds:
      - go run ./scripts/extractorpacks verify --lock internal/extractor/testdata/supplychain/fixture.lock.json --out build/extractor/cache/fixture_embedded_packs_release_gen.go --provenance-out build/extractor/cache/fixture_verified_packs.provenance.json --allow-file --cleanup

  extractor:pack-sdk:fixture:
    summary: Build, sign, and verify the extractor pack SDK host-call fixture
    cmds:
      - go run ./tools/extractorpack hostcall-fixture --out-dir build/extractor/cache/pack_sdk --lock-out build/extractor/cache/pack_sdk/hostcall_fixture.lock.json
      - go run ./scripts/extractorpacks verify --lock build/extractor/cache/pack_sdk/hostcall_fixture.lock.json --out build/extractor/cache/pack_sdk/hostcall_fixture_embedded_packs_release_gen.go --provenance-out build/extractor/cache/pack_sdk/hostcall_fixture_verified_packs.provenance.json --allow-file --cleanup

  extractor:workflow:prepare:
    summary: Prepare extractor generated files for the selected workflow package variant
    cmds:
      - go run ./scripts/extractorpacks prepare-workflow

  extractor:workflow:cleanup:
    summary: Remove workflow-generated extractor pack and policy outputs
    cmds:
      - go run ./scripts/extractorpacks cleanup-workflow

  # Dependency helpers
  deps:update:frontend:
    summary: Update frontend deps (respecting lockfile)
    dir: frontend
    cmds:
      - '{{.PNPM}} update --latest'

  deps:update:go:
    summary: Update Go deps (tidy + check)
    cmds:
      - go mod tidy
      - go list -m all > /dev/null

  # Clean helpers
  clean:dist:
    summary: Remove frontend build artifacts
    cmds:
      - cmd: powershell -NoProfile -Command "if (Test-Path 'frontend/dist') { Remove-Item -Recurse -Force 'frontend/dist' }"
        platforms: [windows]
      - cmd: rm -rf frontend/dist
        platforms: [linux, darwin]

  clean:all:
    summary: Remove frontend dist, binaries, and generated bindings (non-destructive to cache)
    cmds:
      - cmd: powershell -NoProfile -Command "if (Test-Path 'frontend/dist') { Remove-Item -Recurse -Force 'frontend/dist' }; if (Test-Path 'bin') { Remove-Item -Recurse -Force 'bin' }; if (Test-Path 'frontend/bindings') { Remove-Item -Recurse -Force 'frontend/bindings' }"
        platforms: [windows]
      - cmd: rm -rf frontend/dist bin frontend/bindings
        platforms: [linux, darwin]

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  # ==================== Info ====================\n
  info:
    desc: "Show project info"
    cmds:
      - echo "App Name - {{.APP_NAME}}"
      - go version
      - wails3 version
      - node --version
      - pnpm --version
