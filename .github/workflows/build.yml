name: build

on:
  workflow_dispatch:
    inputs:
      extractor_variant:
        description: Extractor package variant
        type: choice
        required: true
        default: generic-no-pack
        options:
          - generic-no-pack
          - full-pack
  release:
    types: [published]

permissions:
  contents: write

jobs:
  resolve-package-variant:
    runs-on: ubuntu-latest
    outputs:
      extractor_variant: ${{ steps.resolve.outputs.extractor_variant }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Resolve extractor package variant
        id: resolve
        shell: bash
        env:
          REQUESTED_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.extractor_variant || '' }}
          RELEASE_VARIANT: ${{ vars.EXTRACTOR_RELEASE_VARIANT }}
          RELEASE_GATE: ${{ vars.EXTRACTOR_FULL_PACK_RELEASE_GATE }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          variant="generic-no-pack"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            variant="${REQUESTED_VARIANT:-generic-no-pack}"
          elif [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            if [ "${RELEASE_VARIANT}" = "full-pack" ] && [ "${RELEASE_GATE}" = "enabled" ]; then
              variant="full-pack"
            fi
          fi
          case "$variant" in
            generic-no-pack|full-pack) ;;
            *) echo "invalid extractor package variant" >&2; exit 1 ;;
          esac
          printf 'extractor_variant=%s\n' "$variant" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "${RELEASE_TAG:-}" >> "$GITHUB_OUTPUT"
          printf 'Resolved extractor package variant: %s\n' "$variant"

  linux-package:
    runs-on: ubuntu-latest
    needs: resolve-package-variant
    env:
      EXTRACTOR_RELEASE_VARIANT: ${{ needs.resolve-package-variant.outputs.extractor_variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify extractor pack supply-chain fixture
        run: wails3 task extractor:packs:fixture

      - name: Prepare generic extractor package variant
        if: env.EXTRACTOR_RELEASE_VARIANT == 'generic-no-pack'
        run: wails3 task extractor:workflow:prepare

      - name: Download full-pack release assets
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/extractor/cache/release_assets
          mkdir -p build/extractor/cache/release_assets
          gh release download "${{ github.event.release.tag_name }}" --pattern 'asset-*.pack.zip' --dir build/extractor/cache/release_assets
          count=$(find build/extractor/cache/release_assets -maxdepth 1 -type f -name 'asset-*.pack.zip' | wc -l | tr -d '[:space:]')
          if [ "$count" -ne 2 ]; then
            find build/extractor/cache/release_assets -maxdepth 1 -type f -print >&2 || true
            echo "expected exactly 2 full-pack assets, found $count" >&2
            exit 1
          fi

      - name: Prepare full-pack extractor package variant from release assets
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name == 'release'
        env:
          EXTRACTOR_FULL_PACK_METADATA_B64: ${{ secrets.EXTRACTOR_FULL_PACK_METADATA_B64 }}
          EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64 }}
          EXTRACTOR_PRIVATE_POLICY_SHA256: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_SHA256 }}
          EXTRACTOR_FULL_PACK_LOCAL_ASSET_DIR: build/extractor/cache/release_assets
        run: wails3 task extractor:workflow:prepare

      - name: Prepare full-pack extractor package variant from public asset URLs
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name != 'release'
        env:
          EXTRACTOR_FULL_PACK_METADATA_B64: ${{ secrets.EXTRACTOR_FULL_PACK_METADATA_B64 }}
          EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64 }}
          EXTRACTOR_PRIVATE_POLICY_SHA256: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_SHA256 }}
        run: wails3 task extractor:workflow:prepare

      - name: Negative check - default Linux resolver fails closed without aria2c
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest pre-installs aria2c at /usr/bin; temporarily hide the
          # binary instead of filtering PATH (which would also remove grep, etc.)
          ARIA2C_PATH="$(command -v aria2c || true)"
          if [ -n "$ARIA2C_PATH" ]; then
            sudo mv "$ARIA2C_PATH" "${ARIA2C_PATH}.hidden"
            trap 'sudo mv "${ARIA2C_PATH}.hidden" "$ARIA2C_PATH"' EXIT
          fi
          if command -v aria2c >/dev/null 2>&1; then
            echo "aria2c unexpectedly present after hiding" >&2
            exit 1
          fi
          if wails3 task linux:prepare:aria2 >linux-prepare-fail.log 2>&1; then
            echo "linux:prepare:aria2 unexpectedly succeeded" >&2
            cat linux-prepare-fail.log >&2
            exit 1
          fi
          grep -qi "bundled aria2 missing" linux-prepare-fail.log

      - name: Install Linux bundled aria2 source
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Package Linux artifact
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: wails3 task linux:package

      - name: Smoke test bundled Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          xvfb-run -a ./bin/goaria-v3 --hidden >linux-smoke.log 2>&1 &
          pid=$!
          sleep 3
          test -x "$HOME/.goaria/aria2c"
          if ! kill -0 "$pid" 2>/dev/null; then
            cat linux-smoke.log >&2
            exit 1
          fi
          kill "$pid" || true
          wait "$pid" || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ needs.resolve-package-variant.outputs.extractor_variant }}
          path: |
            bin/goaria-v3
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm
            bin/*.pkg.tar.zst

      - name: Upload extractor build evidence
        if: hashFiles('build/extractor/extractor_build_evidence.summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: extractor-build-evidence-${{ needs.resolve-package-variant.outputs.extractor_variant }}-linux
          path: build/extractor/extractor_build_evidence.summary.json

      - name: Cleanup extractor workflow outputs
        if: always()
        run: wails3 task extractor:workflow:cleanup

      - name: Upload Linux release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^[[:space:]]+version:/ {print $2; exit}' build/config.yml)
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64) arch=arm64;; esac
          cd bin
          for ext in AppImage deb rpm; do
            for f in *.$ext; do
              [ -f "$f" ] || continue
              newname="goaria-v${version}-linux-${arch}.${ext}"
              mv "$f" "$newname"
              gh release upload "${{ github.event.release.tag_name }}" "$newname" --clobber
            done
          done
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] || continue
            newname="goaria-v${version}-linux-${arch}.pkg.tar.zst"
            mv "$f" "$newname"
            gh release upload "${{ github.event.release.tag_name }}" "$newname" --clobber
          done

  darwin-package:
    runs-on: macos-latest
    needs: resolve-package-variant
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      EXTRACTOR_RELEASE_VARIANT: ${{ needs.resolve-package-variant.outputs.extractor_variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify extractor pack supply-chain fixture
        run: wails3 task extractor:packs:fixture

      - name: Prepare generic extractor package variant
        if: env.EXTRACTOR_RELEASE_VARIANT == 'generic-no-pack'
        run: wails3 task extractor:workflow:prepare

      - name: Download full-pack release assets
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/extractor/cache/release_assets
          mkdir -p build/extractor/cache/release_assets
          gh release download "${{ github.event.release.tag_name }}" --pattern 'asset-*.pack.zip' --dir build/extractor/cache/release_assets
          count=$(find build/extractor/cache/release_assets -maxdepth 1 -type f -name 'asset-*.pack.zip' | wc -l | tr -d '[:space:]')
          if [ "$count" -ne 2 ]; then
            find build/extractor/cache/release_assets -maxdepth 1 -type f -print >&2 || true
            echo "expected exactly 2 full-pack assets, found $count" >&2
            exit 1
          fi

      - name: Prepare full-pack extractor package variant from release assets
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name == 'release'
        env:
          EXTRACTOR_FULL_PACK_METADATA_B64: ${{ secrets.EXTRACTOR_FULL_PACK_METADATA_B64 }}
          EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64 }}
          EXTRACTOR_PRIVATE_POLICY_SHA256: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_SHA256 }}
          EXTRACTOR_FULL_PACK_LOCAL_ASSET_DIR: build/extractor/cache/release_assets
        run: wails3 task extractor:workflow:prepare

      - name: Prepare full-pack extractor package variant from public asset URLs
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name != 'release'
        env:
          EXTRACTOR_FULL_PACK_METADATA_B64: ${{ secrets.EXTRACTOR_FULL_PACK_METADATA_B64 }}
          EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64 }}
          EXTRACTOR_PRIVATE_POLICY_SHA256: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_SHA256 }}
        run: wails3 task extractor:workflow:prepare

      - name: Negative check - default macOS resolver fails closed without aria2c
        shell: bash
        run: |
          set -euo pipefail
          # Defensively hide aria2c if the runner happens to have it pre-installed
          ARIA2C_PATH="$(command -v aria2c || true)"
          if [ -n "$ARIA2C_PATH" ]; then
            sudo mv "$ARIA2C_PATH" "${ARIA2C_PATH}.hidden"
            trap 'sudo mv "${ARIA2C_PATH}.hidden" "$ARIA2C_PATH"' EXIT
          fi
          if command -v aria2c >/dev/null 2>&1; then
            echo "aria2c unexpectedly present after hiding" >&2
            exit 1
          fi
          if wails3 task darwin:prepare:aria2 >darwin-prepare-fail.log 2>&1; then
            echo "darwin:prepare:aria2 unexpectedly succeeded" >&2
            cat darwin-prepare-fail.log >&2
            exit 1
          fi
          grep -qi "bundled aria2 missing" darwin-prepare-fail.log

      - name: Install macOS bundled aria2 source
        run: brew install aria2

      - name: Package macOS artifact
        run: wails3 task darwin:package

      - name: Smoke test bundled macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          ./bin/goaria-v3.app/Contents/MacOS/goaria-v3 --hidden >darwin-smoke.log 2>&1 &
          pid=$!
          sleep 3
          test -x "$HOME/.goaria/aria2c"
          if ! kill -0 "$pid" 2>/dev/null; then
            cat darwin-smoke.log >&2
            exit 1
          fi
          kill "$pid" || true
          wait "$pid" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ needs.resolve-package-variant.outputs.extractor_variant }}
          path: bin/goaria-v3.app

      - name: Upload extractor build evidence
        if: hashFiles('build/extractor/extractor_build_evidence.summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: extractor-build-evidence-${{ needs.resolve-package-variant.outputs.extractor_variant }}-macos
          path: build/extractor/extractor_build_evidence.summary.json

      - name: Cleanup extractor workflow outputs
        if: always()
        run: wails3 task extractor:workflow:cleanup

      - name: Upload macOS release assets
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bin
          version=$(awk -F'"' '/^[[:space:]]+version:/ {print $2; exit}' ../build/config.yml)
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64) arch=arm64;; esac
          zipname="goaria-v${version}-darwin-${arch}.zip"
          zip -r "$zipname" goaria-v3.app
          gh release upload "${{ github.event.release.tag_name }}" "$zipname" --clobber

  windows-package:
    runs-on: windows-latest
    needs: resolve-package-variant
    env:
      EXTRACTOR_RELEASE_VARIANT: ${{ needs.resolve-package-variant.outputs.extractor_variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify extractor pack supply-chain fixture
        run: wails3 task extractor:packs:fixture

      - name: Prepare generic extractor package variant
        if: env.EXTRACTOR_RELEASE_VARIANT == 'generic-no-pack'
        run: wails3 task extractor:workflow:prepare

      - name: Download full-pack release assets
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if (Test-Path 'build/extractor/cache/release_assets') {
            Remove-Item -Recurse -Force 'build/extractor/cache/release_assets'
          }
          New-Item -ItemType Directory -Force -Path 'build/extractor/cache/release_assets' | Out-Null
          gh release download "${{ github.event.release.tag_name }}" --pattern 'asset-*.pack.zip' --dir 'build/extractor/cache/release_assets'
          $files = Get-ChildItem -Path 'build/extractor/cache/release_assets' -Filter 'asset-*.pack.zip' -File
          if ($files.Count -ne 2) {
            $files | ForEach-Object { Write-Error $_.FullName }
            throw "expected exactly 2 full-pack assets, found $($files.Count)"
          }

      - name: Prepare full-pack extractor package variant from release assets
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name == 'release'
        env:
          EXTRACTOR_FULL_PACK_METADATA_B64: ${{ secrets.EXTRACTOR_FULL_PACK_METADATA_B64 }}
          EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64 }}
          EXTRACTOR_PRIVATE_POLICY_SHA256: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_SHA256 }}
          EXTRACTOR_FULL_PACK_LOCAL_ASSET_DIR: build/extractor/cache/release_assets
        run: wails3 task extractor:workflow:prepare

      - name: Prepare full-pack extractor package variant from public asset URLs
        if: env.EXTRACTOR_RELEASE_VARIANT == 'full-pack' && github.event_name != 'release'
        env:
          EXTRACTOR_FULL_PACK_METADATA_B64: ${{ secrets.EXTRACTOR_FULL_PACK_METADATA_B64 }}
          EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_BUNDLE_B64 }}
          EXTRACTOR_PRIVATE_POLICY_SHA256: ${{ secrets.EXTRACTOR_PRIVATE_POLICY_SHA256 }}
        run: wails3 task extractor:workflow:prepare

      - name: Stage bundled aria2c
        run: .\setup.ps1

      - name: Build and package
        run: .\build.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages-${{ needs.resolve-package-variant.outputs.extractor_variant }}
          path: bin/*.zip

      - name: Upload extractor build evidence
        if: hashFiles('build/extractor/extractor_build_evidence.summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: extractor-build-evidence-${{ needs.resolve-package-variant.outputs.extractor_variant }}-windows
          path: build/extractor/extractor_build_evidence.summary.json

      - name: Cleanup extractor workflow outputs
        if: always()
        run: wails3 task extractor:workflow:cleanup

      - name: Upload Windows release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem -Path bin -Filter "*.zip" | ForEach-Object {
            gh release upload "${{ github.event.release.tag_name }}" $_.FullName --clobber
          }
