version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # PGP_KEY: "path/to/signing-key.asc"
  # SIGN_ROLE: "builder"  # Options: origin, maint, archive, builder
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation (used when building on non-Linux or no CC available)
  CROSS_IMAGE: wails-cross

  APPIMAGE_RUNTIME_ARCH:
    sh: |
      target_arch="{{.ARCH | default ARCH}}"
      case "$target_arch" in
        amd64|x86_64) printf 'x86_64' ;;
        arm64|aarch64) printf 'aarch64' ;;
        *) echo "unsupported AppImage runtime architecture: $target_arch" >&2; exit 1 ;;
      esac

  APPIMAGE_RUNTIME_FILE:
    sh: |
      if [ -n "${APPIMAGE_RUNTIME_FILE:-}" ]; then
        case "${APPIMAGE_RUNTIME_FILE}" in
          /*) printf '%s' "${APPIMAGE_RUNTIME_FILE}" ;;
          *) printf '%s/%s' "{{.ROOT_DIR}}" "${APPIMAGE_RUNTIME_FILE}" ;;
        esac
      else
        printf '%s/build/extractor/cache/appimage/runtime-%s' "{{.ROOT_DIR}}" "{{.APPIMAGE_RUNTIME_ARCH}}"
      fi

tasks:
  prepare:aria2:
    summary: Stages the Linux bundled aria2 binary
    cmds:
      - task: common:prepare:aria2:stage
        vars:
          TARGET_OS: linux
          TARGET_ARCH: '{{.ARCH | default ARCH}}'
          TARGET_PATH: internal/process/bundled/linux/aria2c

  prepare:appimage:runtime:
    summary: Caches the AppImage runtime locally
    cmds:
      - |
        set -euo pipefail
        runtime_path="{{.APPIMAGE_RUNTIME_FILE}}"
        runtime_url="https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-{{.APPIMAGE_RUNTIME_ARCH}}"
        mkdir -p "$(dirname "$runtime_path")"
        if [ -s "$runtime_path" ]; then
          echo "Using cached AppImage runtime at $runtime_path"
          exit 0
        fi
        tmp_path="${runtime_path}.tmp"
        rm -f "$tmp_path"
        if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$tmp_path" "$runtime_url"; then
          rm -f "$tmp_path"
          echo "failed to prepare local AppImage runtime file" >&2
          exit 1
        fi
        if [ ! -s "$tmp_path" ]; then
          rm -f "$tmp_path"
          echo "failed to prepare local AppImage runtime file" >&2
          exit 1
        fi
        mv "$tmp_path" "$runtime_path"
        chmod 0644 "$runtime_path"
        echo "Prepared local AppImage runtime at $runtime_path"

  build:
    summary: Builds the application for Linux
    cmds:
      # Linux requires CGO - use Docker when cross-compiling from non-Linux OR when no C compiler is available
      - task: '{{if and (eq OS "linux") (eq .HAS_CC "true")}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRACTOR_VARIANT: '{{.EXTRACTOR_VARIANT}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Check if a C compiler is available (gcc or clang)
      HAS_CC:
        sh: '(command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1) && echo "true" || echo "false"'

  build:native:
    summary: Builds the application natively on Linux
    internal: true
    cmds:
      - task: prepare:aria2
        vars:
          ARCH: '{{.ARCH}}'
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
          EXTRACTOR_VARIANT: '{{.EXTRACTOR_VARIANT}}'
      - task: common:generate:icons
      - task: generate:dotdesktop
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      EXTRACTOR_BUILD_TAGS:
        sh: '. "{{.ROOT_DIR}}/scripts/extractor_tags.sh" "{{.EXTRACTOR_VARIANT}}"'
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{if .EXTRACTOR_BUILD_TAGS}} -tags {{.EXTRACTOR_BUILD_TAGS}}{{end}}{{else}}-tags production{{if .EXTRACTOR_BUILD_TAGS}},{{.EXTRACTOR_BUILD_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Linux using Docker with Zig (for macOS/Windows hosts)
    internal: true
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation to Linux. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: prepare:aria2
        vars:
          ARCH: '{{.ARCH}}'
      - task: common:build:frontend
      - task: common:generate:icons
      - task: generate:dotdesktop
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.GO_CACHE_MOUNT}} {{.REPLACE_MOUNTS}} -e APP_NAME={{.APP_NAME}} -e EXTRACTOR_VARIANT={{.EXTRACTOR_VARIANT}} {{.CROSS_IMAGE}} linux {{.DOCKER_ARCH}}
      - docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
      - mkdir -p {{.BIN_DIR}}
      - mv bin/{{.APP_NAME}}-linux-{{.DOCKER_ARCH}} {{.OUTPUT}}
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Mount Go module cache for faster builds
      GO_CACHE_MOUNT:
        sh: 'echo "-v ${GOPATH:-$HOME/go}/pkg/mod:/go/pkg/mod"'
      # Extract replace directives from go.mod and create -v mounts for each
      REPLACE_MOUNTS:
        sh: |
          grep -E '^replace .* => ' go.mod 2>/dev/null | while read -r line; do
            path=$(echo "$line" | sed -E 's/^replace .* => //' | tr -d '\r')
            # Convert relative paths to absolute
            if [ "${path#/}" = "$path" ]; then
              path="$(cd "$(dirname "$path")" 2>/dev/null && pwd)/$(basename "$path")"
            fi
            # Only mount if directory exists
            if [ -d "$path" ]; then
              echo "-v $path:$path:ro"
            fi
          done | tr '\n' ' '

  package:
    summary: Packages the application for Linux
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
    cmds:
      - task: create:appimage
      - task: create:deb
      - task: create:rpm
      - task: create:aur

  smoke:
    summary: Smoke tests bundled Linux runtime extraction
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        set -euo pipefail
        smoke_timeout_seconds="{{.SMOKE_TIMEOUT_SECONDS | default "30"}}"
        smoke_poll_interval_seconds="{{.SMOKE_POLL_INTERVAL_SECONDS | default "1"}}"
        export HOME="$(mktemp -d)"
        log_path="$HOME/linux-smoke.log"
        aria2_path="$HOME/.goaria/aria2c"
        pid=""

        stop_process() {
          if [ -z "$pid" ]; then
            return 0
          fi
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
          fi
          pid=""
        }

        cleanup() {
          stop_process
          rm -rf "$HOME"
        }

        trap 'cleanup' EXIT

        bash -c 'xvfb-run -a ./bin/{{.APP_NAME}} --hidden >"'"$log_path"'" 2>&1 & echo $! > "'"$HOME"'/xvfb.pid"'
        pid=$(cat "$HOME/xvfb.pid")
        deadline=$(( $(date +%s) + smoke_timeout_seconds ))

        while true; do
          if [ -x "$aria2_path" ]; then
            stop_process
            trap - EXIT
            cleanup
            echo "Bundled Linux runtime smoke test passed"
            exit 0
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log_path" >&2
            echo "bundled Linux runtime smoke test failed before aria2 extraction completed" >&2
            exit 1
          fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            cat "$log_path" >&2
            echo "bundled Linux runtime smoke test timed out waiting for $aria2_path" >&2
            exit 1
          fi
          sleep "$smoke_poll_interval_seconds"
        done

  create:appimage:
    summary: Creates an AppImage
    dir: build/linux/appimage
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
      - task: generate:dotdesktop
      - task: prepare:appimage:runtime
        vars:
          ARCH: '{{.ARCH}}'
    preconditions:
      - sh: '[ -s "{{.APPIMAGE_RUNTIME_FILE}}" ]'
        msg: 'local AppImage runtime file is required. Run: wails3 task linux:prepare:appimage:runtime'
    cmds:
      - APP_NAME="{{.APP_NAME}}" APP_BINARY="{{.APP_BINARY}}" ICON_PATH="{{.ICON_PATH}}" DESKTOP_FILE="{{.DESKTOP_FILE}}" OUTPUT_DIR="{{.OUTPUT_DIR}}" APPIMAGE_RUNTIME_FILE="{{.APPIMAGE_RUNTIME_FILE}}" bash ./build.sh
    vars:
      APP_NAME: '{{.APP_NAME}}'
      APP_BINARY: '../../../bin/{{.APP_NAME}}'
      ICON_PATH: '../../appicon.png'
      DESKTOP_FILE: '../{{.APP_NAME}}.desktop'
      OUTPUT_DIR: '../../../bin'

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:rpm

  create:aur:
    summary: Creates a arch linux packager package
    deps:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
    cmds:
      - task: generate:dotdesktop
      - task: generate:aur

  generate:deb:
    summary: Creates a deb package
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:rpm:
    summary: Creates a rpm package
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:aur:
    summary: Creates a arch linux packager package
    cmds:
      - wails3 tool package -name {{.APP_NAME}} -format archlinux -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux/appimage
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop -categories "{{.CATEGORIES}}"
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: 'Development;'
      OUTPUTFILE: '{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'

  sign:deb:
    summary: Signs the DEB package
    desc: |
      Signs the .deb package with a PGP key.
      Configure PGP_KEY in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:deb
    cmds:
      - wails3 tool sign --input {{.BIN_DIR}}/{{.APP_NAME}}*.deb --pgp-key {{.PGP_KEY}} {{if .SIGN_ROLE}}--role {{.SIGN_ROLE}}{{end}}
    preconditions:
      - sh: '[ -n "{{.PGP_KEY}}" ]'
        msg: "PGP_KEY is required. Set it in the vars section at the top of build/linux/Taskfile.yml"

  sign:rpm:
    summary: Signs the RPM package
    desc: |
      Signs the .rpm package with a PGP key.
      Configure PGP_KEY in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:rpm
    cmds:
      - wails3 tool sign --input {{.BIN_DIR}}/{{.APP_NAME}}*.rpm --pgp-key {{.PGP_KEY}}
    preconditions:
      - sh: '[ -n "{{.PGP_KEY}}" ]'
        msg: "PGP_KEY is required. Set it in the vars section at the top of build/linux/Taskfile.yml"

  sign:packages:
    summary: Signs all Linux packages (DEB and RPM)
    desc: |
      Signs both .deb and .rpm packages with a PGP key.
      Configure PGP_KEY in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    cmds:
      - task: sign:deb
      - task: sign:rpm
    preconditions:
      - sh: '[ -n "{{.PGP_KEY}}" ]'
        msg: "PGP_KEY is required. Set it in the vars section at the top of build/linux/Taskfile.yml"
